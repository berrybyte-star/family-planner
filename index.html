;save();render();alert(t('settingsSaved'))});$('#editTasks')?.addEventListener('click',()=>{if(confirm(t('clearTasksConfirm'))){state.tasks=defaultTasks();save();render()}})}function addExtra(){let input=$('#newTask'),txt=input.value.trim();if(!txt)return;ensureDay(selectedDate);let list=dateTasks(selectedDate);list.push({id:'x'+Date.now(),text:txt,done:false,extra:true});state.records[selectedDate]=list;save();render()}function surprise(){let choices=Object.keys(themes).filter(x=>x!==state.theme);setTheme(choices[Math.floor(Math.random()*choices.length)]);render()}checkMonth();if(state.started){if(!state.tasks.length)state.tasks=defaultTasks();render()}else welcome();
})();</script><script>if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
